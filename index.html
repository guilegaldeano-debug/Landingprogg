<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c1c1e" />
    <title>Semana — Organizador</title>
    <style>
      html, body { margin: 0; padding: 0; }
      html { background: #1c1c1e; color-scheme: dark; }
      html[data-theme="light"] { background: #ffffff; color-scheme: light; }
      #root { min-height: 100vh; }
    </style>
    <script>
      // Aplica o tema antes do primeiro paint, senao a tela pisca no tema errado.
      (function () {
        var t = "dark";
        try {
          var p = JSON.parse(localStorage.getItem("wk_prefs") || "{}");
          t = p.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
