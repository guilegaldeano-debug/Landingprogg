<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b14" />
    <title>Semana — Organizador</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; padding: 0; }
      html { background: #0a0e17; color-scheme: dark; }
      html[data-theme="light"] { background: #f5f7fb; color-scheme: light; }
      #root { min-height: 100vh; }
    </style>
    <script>
      // Aplica o tema antes do primeiro paint, senao a tela pisca no tema errado.
      (function () {
        var t = "dark";
        try {
          var p = JSON.parse(localStorage.getItem("wk_prefs") || "{}");
          t = p.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
